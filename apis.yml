aid: thistle-technologies
name: Thistle Technologies
description: >-
  Thistle Technologies provides security tools, libraries, and services for the
  developers who build connected and embedded devices. Founded by security
  veteran Window Snyder and backed by DCVC, the company offers a turnkey
  embedded-device security platform whose two headline products are the Thistle
  Update Solution (end-to-end over-the-air firmware and software updates for
  Embedded Linux on ARM/ARM64 and x86-64 as well as Infineon PSoC 6
  microcontrollers) and Thistle Secure Boot Enablement (tools and services for
  enabling secure/verified boot with managed key handling and firmware signing
  on hardware such as Espressif ESP32, Infineon OPTIGA Trust M secure elements,
  and U-Boot targets including the Raspberry Pi 4 and BeagleBone). Thistle helps
  device makers add mechanisms that keep IoT and edge/AI hardware updatable and
  resistant to compromise without building the security infrastructure
  themselves. The offering is delivered as SDKs, libraries, and managed services
  integrated into a customer's device firmware rather than as a public web API.
